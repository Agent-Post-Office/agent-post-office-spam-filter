name: Publish

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          check-latest: true
          registry-url: https://registry.npmjs.org
          package-manager-cache: false

      - name: Ensure npm CLI >= 11.5.1
        run: |
          npm install -g npm@latest
          node_version="$(node --version | sed 's/^v//')"
          npm_version="$(npm --version)"
          echo "node ${node_version}"
          echo "npm ${npm_version}"
          if ! printf '%s\n%s\n' "22.14.0" "${node_version}" | sort -C -V; then
            echo "::error::Node ${node_version} is older than 22.14.0"
            exit 1
          fi
          if ! printf '%s\n%s\n' "11.5.1" "${npm_version}" | sort -C -V; then
            echo "::error::npm ${npm_version} is older than 11.5.1"
            exit 1
          fi

      - name: Install dependencies
        run: npm ci

      - name: Test
        run: npm test

      - name: Build
        run: npm run build

      - name: Verify tag matches package.json version
        env:
          TAG: ${{ github.ref_name }}
        run: |
          version="$(npm pkg get version | tr -d '"')"
          if [ "${TAG}" != "v${version}" ]; then
            echo "::error::Tag ${TAG} does not match package.json version v${version}"
            exit 1
          fi

      - name: Publish to npm
        run: npm publish --provenance --access public
